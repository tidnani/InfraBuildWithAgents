name: Terraform Tests

on:
  push:
    branches:
      - main
    paths:
      - 'modules/**'
      - 'tests/**'
  pull_request:
    branches:
      - main
    paths:
      - 'modules/**'
      - 'tests/**'
  workflow_dispatch:
    inputs:
      test_suite:
        description: 'Test suite to run (all or module name)'
        required: false
        default: 'all'
        type: string

permissions:
  id-token: write
  contents: read
  pull-requests: write

env:
  TF_VERSION: "1.9.8"
  GO_VERSION: "1.22"
  ARM_USE_OIDC: "true"
  ARM_SUBSCRIPTION_ID: ${{ secrets.DEV_AZURE_SUBSCRIPTION_ID || secrets.AZURE_SUBSCRIPTION_ID }}
  ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}

jobs:
  # ─────────────────────────────────────────────
  # Unit-style validation (no Azure credentials needed)
  # ─────────────────────────────────────────────
  unit-tests:
    name: Unit Tests (fmt + validate)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Validate all modules
        run: |
          for module in modules/*/; do
            echo "Validating $module ..."
            (cd "$module" && terraform init -backend=false && terraform validate)
          done

  # ─────────────────────────────────────────────
  # Integration tests using Terratest (requires Azure)
  # ─────────────────────────────────────────────
  integration-tests:
    name: Integration Tests (Terratest)
    runs-on: ubuntu-latest
    needs: unit-tests
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    environment: dev

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: tests/go.sum

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.DEV_AZURE_SUBSCRIPTION_ID || secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Install Go dependencies
        run: go mod download
        working-directory: tests

      - name: Run Terratest integration tests
        run: |
          TEST_SUITE="${{ github.event.inputs.test_suite || 'all' }}"
          if [ "$TEST_SUITE" = "all" ]; then
            go test -v -timeout 60m ./...
          else
            go test -v -timeout 60m -run "Test${TEST_SUITE^}" ./...
          fi
        working-directory: tests
        env:
          AZURE_SUBSCRIPTION_ID: ${{ secrets.DEV_AZURE_SUBSCRIPTION_ID || secrets.AZURE_SUBSCRIPTION_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}

      - name: Publish Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: tests/test-results/
          retention-days: 30
